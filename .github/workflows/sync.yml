name: NFL & Sleeper Picks Automation

on:
  schedule:
    # Tuesday 10:00 UTC: Pre-populates matchups for the week
    - cron: '0 10 * * 2'
    # Game windows: Scores finished games
    - cron: '*/30 17-23 * * 0'
    - cron: '*/30 0-5 * * 1,2'
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Removed cache: 'pip' to prevent missing file errors

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WEEKS_DB_ID: ${{ secrets.NOTION_WEEKS_DB_ID }}
          NOTION_MATCHUPS_DB_ID: ${{ secrets.NOTION_MATCHUPS_DB_ID }}
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: python sync_picks.py