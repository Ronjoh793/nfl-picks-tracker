name: NFL & Sleeper Picks Sync

on:
  schedule:
    # 1. Tuesday at 10:00 UTC (Early morning US time):
    # Detects the new Sleeper week and auto-creates all upcoming matchup rows.
    - cron: '0 10 * * 2'

    # 2. Game Windows (Runs every 30 minutes to capture finals and record winners):
    # Sunday evening games (17:00 to 23:59 UTC / 10 AM - 4 PM PT)
    - cron: '*/30 17-23 * * 0'
    # Sunday Night / Monday Night football conclusion (00:00 to 05:00 UTC / 5 PM - 10 PM PT)
    - cron: '*/30 0-5 * * 1,2'

  # Allows you to click a button in GitHub and run the script instantly on demand
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Step A: Download your repo files onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step B: Spin up a fresh Python environment
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step C: Install the requests library
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step D: Execute the script, injecting repository secrets into environment variables
      - name: Run sync script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WEEKS_DB_ID: ${{ secrets.NOTION_WEEKS_DB_ID }}
          NOTION_MATCHUPS_DB_ID: ${{ secrets.NOTION_MATCHUPS_DB_ID }}
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
        run: python sync_picks.py